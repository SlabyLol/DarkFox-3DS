name: Build DarkFox-3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════
  # JOB 1: bannertool + makerom herunterladen
  # ═══════════════════════════════════════════════════════
  build-tools:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Abhängigkeiten installieren
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: bannertool herunterladen (pre-built Linux binary)
        run: |
          mkdir -p ~/tools /tmp/bt
          # Release v1.2.2 enthält Linux-Binary aus 1.2.0
          gh release download v1.2.2 \
            --repo Epicpkmn11/bannertool \
            --pattern "*.zip" \
            -D /tmp/bt
          echo "=== Heruntergeladene Dateien ==="
          ls -la /tmp/bt/
          cd /tmp/bt && unzip -o *.zip
          echo "=== Nach dem Entpacken ==="
          find /tmp/bt -type f | sort
          # Linux-Binary finden (nicht .exe)
          BIN=$(find /tmp/bt -type f -name "bannertool" ! -name "*.exe" | head -1)
          if [ -z "$BIN" ]; then
            # Manchmal ohne Endung oder mit linux im Namen
            BIN=$(find /tmp/bt -type f ! -name "*.exe" ! -name "*.zip" ! -name "*.txt" ! -name "*.md" | head -1)
          fi
          echo "→ Binary: $BIN"
          cp "$BIN" ~/tools/bannertool
          chmod +x ~/tools/bannertool
          echo "✅ bannertool bereit"

      - name: makerom herunterladen (pre-built Linux binary)
        run: |
          mkdir -p /tmp/mr
          # makerom v0.19.0 hat Linux-Binary als Release-Asset
          gh release download makerom-v0.19.0 \
            --repo 3DSGuy/Project_CTR \
            --pattern "*linux*" \
            -D /tmp/mr || \
          gh release download makerom-v0.19.0 \
            --repo 3DSGuy/Project_CTR \
            -D /tmp/mr
          echo "=== Heruntergeladene Dateien ==="
          ls -la /tmp/mr/
          # Linux-Binary finden
          BIN=$(find /tmp/mr -type f ! -name "*.exe" ! -name "*.zip" ! -name "*.tar.gz" ! -name "*.txt" ! -name "*.md" | head -1)
          echo "→ Binary: $BIN"
          cp "$BIN" ~/tools/makerom
          chmod +x ~/tools/makerom
          echo "✅ makerom bereit"

      - name: Tools testen
        run: |
          echo "bannertool: $(~/tools/bannertool --version 2>&1 || echo 'OK')"
          echo "makerom:    $(~/tools/makerom --version 2>&1 || echo 'OK')"

      - name: Tools als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: build-tools
          path: ~/tools/
          retention-days: 1

  # ═══════════════════════════════════════════════════════
  # JOB 2: 3DS Projekt bauen (im devkitPro Container)
  # ═══════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    needs: build-tools
    container:
      image: devkitpro/devkitarm:20240202
      env:
        DEVKITPRO: /opt/devkitpro
        DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      # ─────────────────────────────────────────────
      # 1. Code auschecken
      # ─────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. PATH setzen
      # ─────────────────────────────────────────────
      - name: PATH setzen
        run: |
          echo "PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:/usr/local/bin:$PATH" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 3. Build-Tools aus Job 1 herunterladen
      # ─────────────────────────────────────────────
      - name: Build-Tools herunterladen
        uses: actions/download-artifact@v4
        with:
          name: build-tools
          path: /usr/local/bin/

      - name: Tools ausführbar machen
        run: |
          chmod +x /usr/local/bin/bannertool
          chmod +x /usr/local/bin/makerom
          echo "bannertool: $(bannertool --version 2>&1 || echo 'OK')"
          echo "makerom:    $(makerom --version 2>&1 || echo 'OK')"

      # ─────────────────────────────────────────────
      # 4. Projekt bauen → erzeugt .elf + .3dsx
      # ─────────────────────────────────────────────
      - name: Build project (3DSX + ELF)
        run: make

      # ─────────────────────────────────────────────
      # 5. resources/ vorbereiten falls nicht vorhanden
      # ─────────────────────────────────────────────
      - name: Fehlende Resources erstellen (Stubs)
        run: |
          mkdir -p resources

          if [ ! -f resources/icon.png ]; then
            echo "⚠ Kein icon.png – erstelle Placeholder"
            python3 -c "
          import struct, zlib
          def write_png(path, w, h, color=(100, 100, 180)):
              def chunk(tag, data):
                  c = zlib.crc32(tag + data) & 0xFFFFFFFF
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', c)
              raw = b''
              for _ in range(h):
                  row = b'\x00'
                  for _ in range(w):
                      row += bytes(color) + b'\xff'
                  raw += row
              idat = zlib.compress(raw)
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))
          write_png('resources/icon.png', 48, 48)
          "
          fi

          if [ ! -f resources/banner.png ]; then
            echo "⚠ Kein banner.png – erstelle Placeholder"
            python3 -c "
          import struct, zlib
          def write_png(path, w, h, color=(30, 30, 60)):
              def chunk(tag, data):
                  c = zlib.crc32(tag + data) & 0xFFFFFFFF
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', c)
              raw = b''
              for _ in range(h):
                  row = b'\x00'
                  for _ in range(w):
                      row += bytes(color) + b'\xff'
                  raw += row
              idat = zlib.compress(raw)
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))
          write_png('resources/banner.png', 256, 128)
          "
          fi

          if [ ! -f resources/audio.wav ]; then
            echo "⚠ Kein audio.wav – erstelle stille WAV"
            python3 -c "
          import struct
          sample_rate = 22050
          data_size   = sample_rate * 2
          with open('resources/audio.wav', 'wb') as f:
              f.write(b'RIFF')
              f.write(struct.pack('<I', 36 + data_size))
              f.write(b'WAVE')
              f.write(b'fmt ')
              f.write(struct.pack('<IHHIIHH', 16, 1, 1, sample_rate, sample_rate*2, 2, 16))
              f.write(b'data')
              f.write(struct.pack('<I', data_size))
              f.write(b'\x00' * data_size)
          "
          fi

          if [ ! -f resources/app.rsf ]; then
            echo "⚠ Kein app.rsf – erstelle Standard-RSF"
            cat > resources/app.rsf << 'RSF'
          BasicInfo:
            Title:           DarkFox-3DS
            CompanyCode:     "0F"
            ProductCode:     CTR-P-DFOX
            ContentType:     Application

          Option:
            UseOnSD:          true
            FreeProductCode:  true
            MediaFootPadding: false
            EnableCrypt:      false
            EnableCompress:   false

          Rom:
            HostRoot: ""

          ExeFs:
            StackSize:        0x10000
            RemasterVersion:  0

          SystemControlInfo:
            SaveDataSize:     0x8000
          RSF
          fi

          echo "=== Resources ===" && ls -la resources/

      # ─────────────────────────────────────────────
      # 6. SMDH + Banner + CIA bauen
      # ─────────────────────────────────────────────
      - name: CIA bauen
        run: |
          ELF=$(find . -maxdepth 2 -name "*.elf" | head -n1)
          if [ -z "$ELF" ]; then
            echo "❌ Keine .elf Datei gefunden!" && exit 1
          fi
          echo "✅ ELF: $ELF"

          bannertool makesmdh \
            -s "DarkFox-3DS" -l "DarkFox-3DS Homebrew" -p "DarkFox Team" \
            -i resources/icon.png -o DarkFox.smdh

          bannertool makebanner \
            -i resources/banner.png -a resources/audio.wav -o DarkFox.bnr

          makerom -f cia -target t -exefslogo \
            -o DarkFox.cia -elf "$ELF" -rsf resources/app.rsf \
            -banner DarkFox.bnr -icon DarkFox.smdh

          echo "✅ CIA erstellt"

      # ─────────────────────────────────────────────
      # 7. Build-Ausgabe prüfen
      # ─────────────────────────────────────────────
      - name: Build-Ausgabe prüfen
        run: |
          find . -maxdepth 2 \( \
            -name "*.3dsx" -o -name "*.cia" -o -name "*.elf" -o \
            -name "*.smdh" -o -name "*.bnr" \
          \) 2>/dev/null | sort
          ls -lh *.3dsx *.cia *.smdh 2>/dev/null || true

      # ─────────────────────────────────────────────
      # 8. Artifacts hochladen
      # ─────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkFox-3DS-build
          path: |
            ${{ github.workspace }}/*.3dsx
            ${{ github.workspace }}/*.cia
            ${{ github.workspace }}/*.smdh
            ${{ github.workspace }}/*.elf
          if-no-files-found: error
          retention-days: 30
