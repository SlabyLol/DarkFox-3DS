name: Build DarkFox-3DS
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20240202
      env:
        DEVKITPRO: /opt/devkitpro
        DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PATH setzen
        run: |
          echo "PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:/usr/local/bin:$PATH" >> $GITHUB_ENV

      - name: makerom & bannertool installieren
        run: |
          # bannertool
          curl -L https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool-linux-x86_64.zip -o bannertool.zip
          unzip bannertool.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/bannertool

          # makerom
          curl -L https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -o makerom.zip
          unzip makerom.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/makerom

          # Versionen prüfen
          bannertool --version || true
          makerom --version || true

      - name: Build project (3DSX)
        run: make

      - name: CIA bauen
        run: |
          # Banner + Icon generieren (passe Pfade an dein Projekt an)
          bannertool makesmdh \
            -s "DarkFox-3DS" \
            -l "DarkFox-3DS Application" \
            -p "Author" \
            -i resources/icon.png \
            -o DarkFox.smdh

          bannertool makebanner \
            -i resources/banner.png \
            -a resources/audio.wav \
            -o DarkFox.bnr

          # CIA erstellen
          makerom -f cia \
            -target t \
            -exefslogo \
            -o DarkFox.cia \
            -elf DarkFox.elf \
            -rsf resources/app.rsf \
            -banner DarkFox.bnr \
            -icon DarkFox.smdh \
            -logo resources/logo.bcma.lz

      - name: Build-Ausgabe prüfen
        run: |
          echo "=== Verzeichnis ==="
          ls -la
          echo "=== Dateien suchen ==="
          find . -name "*.3dsx" -o -name "*.cia" -o -name "*.elf" -o -name "*.smdh" 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkFox-3DS-build
          path: |
            ${{ github.workspace }}/*.3dsx
            ${{ github.workspace }}/*.cia
            ${{ github.workspace }}/*.smdh
            ${{ github.workspace }}/*.elf
          if-no-files-found: error
