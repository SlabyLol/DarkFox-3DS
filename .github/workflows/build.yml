name: Build DarkFox-3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════
  # JOB 1: bannertool + makerom bauen (außerhalb Container)
  # ═══════════════════════════════════════════════════════
  build-tools:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential curl tar file

      - name: bannertool bauen
        run: |
          mkdir -p /tmp/bannertool-src
          echo "→ Lade bannertool..."
          curl -L --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o /tmp/bannertool.tar.gz \
            "https://api.github.com/repos/Steveice10/bannertool/tarball"
          echo "→ Dateigröße: $(wc -c < /tmp/bannertool.tar.gz) Bytes"
          file /tmp/bannertool.tar.gz
          tar -xz -C /tmp/bannertool-src \
            --strip-components=1 \
            -f /tmp/bannertool.tar.gz
          cd /tmp/bannertool-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          mkdir -p ~/tools
          cp build/bannertool ~/tools/bannertool
          echo "✅ bannertool gebaut"

      - name: makerom bauen
        run: |
          mkdir -p /tmp/makerom-src
          echo "→ Lade Project_CTR..."
          curl -L --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o /tmp/makerom.tar.gz \
            "https://api.github.com/repos/3DSGuy/Project_CTR/tarball"
          echo "→ Dateigröße: $(wc -c < /tmp/makerom.tar.gz) Bytes"
          file /tmp/makerom.tar.gz
          tar -xz -C /tmp/makerom-src \
            --strip-components=1 \
            -f /tmp/makerom.tar.gz
          cd /tmp/makerom-src/makerom
          make
          cp makerom ~/tools/makerom
          echo "✅ makerom gebaut"

      - name: Tools als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: build-tools
          path: ~/tools/
          retention-days: 1

  # ═══════════════════════════════════════════════════════
  # JOB 2: 3DS Projekt bauen (im devkitPro Container)
  # ═══════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    needs: build-tools
    container:
      image: devkitpro/devkitarm:20240202
      env:
        DEVKITPRO: /opt/devkitpro
        DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      # ─────────────────────────────────────────────
      # 1. Code auschecken
      # ─────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. PATH setzen
      # ─────────────────────────────────────────────
      - name: PATH setzen
        run: |
          echo "PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:/usr/local/bin:$PATH" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 3. Build-Tools aus Job 1 herunterladen
      # ─────────────────────────────────────────────
      - name: Build-Tools herunterladen
        uses: actions/download-artifact@v4
        with:
          name: build-tools
          path: /usr/local/bin/

      - name: Tools ausführbar machen
        run: |
          chmod +x /usr/local/bin/bannertool
          chmod +x /usr/local/bin/makerom
          echo "bannertool: $(bannertool --version 2>&1 || echo 'OK')"
          echo "makerom:    $(makerom --version 2>&1 || echo 'OK')"

      # ─────────────────────────────────────────────
      # 4. Projekt bauen → erzeugt .elf + .3dsx
      # ─────────────────────────────────────────────
      - name: Build project (3DSX + ELF)
        run: make

      # ─────────────────────────────────────────────
      # 5. resources/ vorbereiten falls nicht vorhanden
      # ─────────────────────────────────────────────
      - name: Fehlende Resources erstellen (Stubs)
        run: |
          mkdir -p resources

          # icon.png (48x48)
          if [ ! -f resources/icon.png ]; then
            echo "⚠ Kein icon.png – erstelle Placeholder"
            python3 -c "
          import struct, zlib
          def write_png(path, w, h, color=(100, 100, 180)):
              def chunk(tag, data):
                  c = zlib.crc32(tag + data) & 0xFFFFFFFF
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', c)
              raw = b''
              for _ in range(h):
                  row = b'\x00'
                  for _ in range(w):
                      row += bytes(color) + b'\xff'
                  raw += row
              idat = zlib.compress(raw)
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))
          write_png('resources/icon.png', 48, 48)
          "
          fi

          # banner.png (256x128)
          if [ ! -f resources/banner.png ]; then
            echo "⚠ Kein banner.png – erstelle Placeholder"
            python3 -c "
          import struct, zlib
          def write_png(path, w, h, color=(30, 30, 60)):
              def chunk(tag, data):
                  c = zlib.crc32(tag + data) & 0xFFFFFFFF
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', c)
              raw = b''
              for _ in range(h):
                  row = b'\x00'
                  for _ in range(w):
                      row += bytes(color) + b'\xff'
                  raw += row
              idat = zlib.compress(raw)
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))
          write_png('resources/banner.png', 256, 128)
          "
          fi

          # audio.wav (stumm, 1 Sek.)
          if [ ! -f resources/audio.wav ]; then
            echo "⚠ Kein audio.wav – erstelle stille WAV"
            python3 -c "
          import struct
          sample_rate = 22050
          data_size   = sample_rate * 2
          with open('resources/audio.wav', 'wb') as f:
              f.write(b'RIFF')
              f.write(struct.pack('<I', 36 + data_size))
              f.write(b'WAVE')
              f.write(b'fmt ')
              f.write(struct.pack('<IHHIIHH', 16, 1, 1, sample_rate, sample_rate*2, 2, 16))
              f.write(b'data')
              f.write(struct.pack('<I', data_size))
              f.write(b'\x00' * data_size)
          "
          fi

          # app.rsf
          if [ ! -f resources/app.rsf ]; then
            echo "⚠ Kein app.rsf – erstelle Standard-RSF"
            cat > resources/app.rsf << 'RSF'
          BasicInfo:
            Title:           DarkFox-3DS
            CompanyCode:     "0F"
            ProductCode:     CTR-P-DFOX
            ContentType:     Application

          Option:
            UseOnSD:          true
            FreeProductCode:  true
            MediaFootPadding: false
            EnableCrypt:      false
            EnableCompress:   false

          Rom:
            HostRoot: ""

          ExeFs:
            StackSize:        0x10000
            RemasterVersion:  0

          SystemControlInfo:
            SaveDataSize:     0x8000
          RSF
          fi

          echo "=== Resources ==="
          ls -la resources/

      # ─────────────────────────────────────────────
      # 6. SMDH + Banner + CIA bauen
      # ─────────────────────────────────────────────
      - name: CIA bauen
        run: |
          ELF=$(find . -maxdepth 2 -name "*.elf" | head -n1)
          if [ -z "$ELF" ]; then
            echo "❌ Keine .elf Datei gefunden!"
            exit 1
          fi
          echo "✅ ELF gefunden: $ELF"

          bannertool makesmdh \
            -s "DarkFox-3DS" \
            -l "DarkFox-3DS Homebrew" \
            -p "DarkFox Team" \
            -i resources/icon.png \
            -o DarkFox.smdh

          bannertool makebanner \
            -i resources/banner.png \
            -a resources/audio.wav \
            -o DarkFox.bnr

          makerom -f cia \
            -target t \
            -exefslogo \
            -o DarkFox.cia \
            -elf "$ELF" \
            -rsf resources/app.rsf \
            -banner DarkFox.bnr \
            -icon DarkFox.smdh

          echo "✅ CIA erfolgreich erstellt"

      # ─────────────────────────────────────────────
      # 7. Build-Ausgabe prüfen
      # ─────────────────────────────────────────────
      - name: Build-Ausgabe prüfen
        run: |
          echo "=== Alle Build-Dateien ==="
          find . -maxdepth 2 \( \
            -name "*.3dsx" -o \
            -name "*.cia"  -o \
            -name "*.elf"  -o \
            -name "*.smdh" -o \
            -name "*.bnr"  \
          \) 2>/dev/null | sort
          echo ""
          echo "=== Dateigrößen ==="
          ls -lh *.3dsx *.cia *.smdh 2>/dev/null || true

      # ─────────────────────────────────────────────
      # 8. Artifacts hochladen
      # ─────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkFox-3DS-build
          path: |
            ${{ github.workspace }}/*.3dsx
            ${{ github.workspace }}/*.cia
            ${{ github.workspace }}/*.smdh
            ${{ github.workspace }}/*.elf
          if-no-files-found: error
          retention-days: 30
